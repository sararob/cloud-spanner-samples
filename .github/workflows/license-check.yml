name: License Header Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Check license headers
        # The -check flag ensures the workflow fails if headers are missing.
        run: go run github.com/google/addlicense@v1.1.1 -check -c "Google LLC" -l apache .
